name: MMM Engine Isolation Test

# Runs engine.py alone against a hand-written script.json, skipping brain.py
# entirely. TEMPORARY - for verifying the Pixabay/real-footage visual
# sourcing pipeline on a real runner (real network, real ffmpeg) without
# depending on Gemini quota. Safe to delete once that's confirmed working.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Ensure FFmpeg + fonts
        run: |
          NEED=""
          command -v ffmpeg >/dev/null || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi dejavu || NEED="$NEED fonts-dejavu-core"
          if [ -n "$NEED" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq $NEED
          fi
          ffmpeg -version | head -n1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write test script.json
        run: |
          cat > script.json <<'JSON'
          {
            "title": "How Coffee Is Made (engine test)",
            "description": "Isolation test fixture - not real content.",
            "scenes": [
              {
                "scene": 1,
                "beat": "HOOK",
                "narration": "Every cup of coffee begins the same way: a handful of raw green beans, tumbling inside a roaster, slowly turning from pale green to deep brown as heat unlocks the oils trapped inside them.",
                "image_keywords": ["coffee beans roasting", "hands holding coffee beans", "coffee roaster machine", "close up coffee beans"]
              },
              {
                "scene": 2,
                "beat": "CONTEXT",
                "narration": "Once roasted and ground, the coffee meets hot water under pressure, forced through in under thirty seconds, pulling out the sugars, the acids, and the crema that floats on top of every good shot.",
                "image_keywords": ["barista pouring latte art", "espresso machine brewing coffee", "hands making coffee"]
              },
              {
                "scene": 3,
                "beat": "ESCALATION",
                "narration": "A single bean can hold over a thousand distinct aromatic compounds, more than red wine, more than almost anything else humans regularly eat or drink.",
                "image_keywords": ["coffee beans falling slow motion", "coffee cup steam rising"]
              },
              {
                "scene": 4,
                "beat": "RESONANCE",
                "narration": "And then it just becomes a moment: two people, a table, and a shared cup, repeated billions of times a day, in every country on earth.",
                "image_keywords": ["people drinking coffee outdoor cafe", "friends talking at cafe table", "city street morning coffee"]
              }
            ]
          }
          JSON
          python -c "import json; json.load(open('script.json'))" && echo "script.json is valid JSON"

      - name: Run Engine (video assembler)
        env:
          VOICE: en-US-GuyNeural
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python engine.py

      - name: Deliver test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-video
          path: |
            final_video.mp4
            subtitles.srt
          if-no-files-found: warn
          retention-days: 3
