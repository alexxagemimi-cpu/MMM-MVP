name: MMM Offline Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (leave blank to let the AI choose)'
        required: false
        default: ''
      minutes:
        description: 'Target length'
        required: false
        default: '12'
        type: choice
        options: ['4', '6', '8', '10', '12', '14', '16']
      voice:
        description: 'Edge-TTS voice'
        required: false
        default: 'en-US-GuyNeural'
        type: choice
        options:
          - en-US-GuyNeural
          - en-US-ChristopherNeural
          - en-US-EricNeural
          - en-US-RogerNeural
          - en-GB-RyanNeural
          - en-US-AndrewNeural
      passes:
        description: 'Quality/fact-check revision passes (more = slower, better)'
        required: false
        default: '4'
        type: choice
        options: ['1', '2', '3', '4', '6', '8']
      skip_brain_test_fixture:
        description: 'TEST MODE: skip Brain, use a hand-written script.json (for testing Engine alone, e.g. when the Gemini quota is exhausted)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  repository_dispatch:
    types: [start-render]

# a second run would fight the first for the runner; queue it instead
concurrency:
  group: mmm-factory
  cancel-in-progress: false

# this job only reads the repo - no reason to hand it write access
permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    # a hung run bills against the monthly Actions quota for as long as it
    # hangs, so keep the ceiling near the real worst case
    timeout-minutes: 45

    env:
      # without this Python block-buffers stdout and the log stays empty
      # until the step finishes, which looks exactly like a hang
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Ensure FFmpeg + fonts
        run: |
          NEED=""
          command -v ffmpeg >/dev/null || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi dejavu || NEED="$NEED fonts-dejavu-core"
          if [ -n "$NEED" ]; then
            echo "installing:$NEED"
            sudo apt-get update -qq
            sudo apt-get install -y -qq $NEED
          else
            echo "ffmpeg and fonts already present on the runner"
          fi
          ffmpeg -version | head -n1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Brain (scriptwriter)
        if: ${{ github.event.inputs.skip_brain_test_fixture != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          TOPIC:          ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
          TARGET_MINUTES: ${{ github.event.inputs.minutes || github.event.client_payload.minutes || '12' }}
          STRICT_FACTS:   ${{ vars.STRICT_FACTS || '1' }}
          MAX_PASSES:     ${{ github.event.inputs.passes || vars.MAX_PASSES || '4' }}
          # Web research. All OPTIONAL - with none of these set, research falls
          # back to keyless DuckDuckGo, which needs no signup and has no quota.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Fallback writer models, used only if Gemini is rate-limited.
          # Both are free-tier with no card. Unset -> simply skipped.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
        run: python brain.py

      - name: Write test script.json (skip_brain_test_fixture)
        if: ${{ github.event.inputs.skip_brain_test_fixture == 'true' }}
        run: |
          cat > script.json <<'JSON'
          {
            "title": "How Coffee Is Made (engine test)",
            "description": "Isolation test fixture - not real content.",
            "scenes": [
              {
                "scene": 1,
                "beat": "HOOK",
                "narration": "Every cup of coffee begins the same way: a handful of raw green beans, tumbling inside a roaster, slowly turning from pale green to deep brown as heat unlocks the oils trapped inside them.",
                "image_keywords": ["coffee beans roasting", "hands holding coffee beans", "coffee roaster machine", "close up coffee beans"]
              },
              {
                "scene": 2,
                "beat": "CONTEXT",
                "narration": "Once roasted and ground, the coffee meets hot water under pressure, forced through in under thirty seconds, pulling out the sugars, the acids, and the crema that floats on top of every good shot.",
                "image_keywords": ["barista pouring latte art", "espresso machine brewing coffee", "hands making coffee"]
              },
              {
                "scene": 3,
                "beat": "ESCALATION",
                "narration": "A single bean can hold over a thousand distinct aromatic compounds, more than red wine, more than almost anything else humans regularly eat or drink.",
                "image_keywords": ["coffee beans falling slow motion", "coffee cup steam rising"]
              },
              {
                "scene": 4,
                "beat": "RESONANCE",
                "narration": "And then it just becomes a moment: two people, a table, and a shared cup, repeated billions of times a day, in every country on earth.",
                "image_keywords": ["people drinking coffee outdoor cafe", "friends talking at cafe table", "city street morning coffee"]
              }
            ]
          }
          JSON
          python -c "import json; json.load(open('script.json'))" && echo "script.json is valid JSON"

      - name: Upload script for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-json
          path: script.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run Engine (video assembler)
        env:
          VOICE: ${{ github.event.inputs.voice || github.event.client_payload.voice || 'en-US-GuyNeural' }}
          # optional: real Pixabay stock footage/photos instead of AI images.
          # unset -> engine falls back to AI images only, same as before.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python engine.py

      - name: Disk report
        if: always()
        run: df -h / | tail -1

      - name: Deliver 720p video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finished-720p-video
          path: |
            final_video.mp4
            subtitles.srt
            captions.ass
          if-no-files-found: warn
          # GitHub Free includes 500 MB of artifact storage in total. A 12-min
          # 720p file is ~100-150 MB, so 30-day retention fills the quota after
          # three or four videos and uploads then start failing. Download it,
          # then let it expire.
          retention-days: 3
