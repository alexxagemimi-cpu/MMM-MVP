name: MMM Offline Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (leave blank to let the AI choose)'
        required: false
        default: ''
      minutes:
        description: 'Target length in minutes'
        required: false
        default: '12'
      voice:
        description: 'Edge-TTS voice'
        required: false
        default: 'en-US-GuyNeural'
        type: choice
        options:
          - en-US-GuyNeural
          - en-US-ChristopherNeural
          - en-US-EricNeural
          - en-US-RogerNeural
          - en-GB-RyanNeural
          - en-US-AndrewNeural
  repository_dispatch:
    types: [start-render]

# a second run would fight the first for the runner
concurrency:
  group: mmm-factory
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Fetch repo
        uses: actions/checkout@v4

      - name: ⚙️ Install FFmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n1
          fc-list | grep -ci dejavu || true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Run Brain (scriptwriter)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          TOPIC:          ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
          TARGET_MINUTES: ${{ github.event.inputs.minutes || github.event.client_payload.minutes || '12' }}
        run: python brain.py

      - name: 📄 Upload script for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-json
          path: script.json
          if-no-files-found: warn
          retention-days: 30

      - name: 🎬 Run Engine (video assembler)
        env:
          VOICE: ${{ github.event.inputs.voice || github.event.client_payload.voice || 'en-US-GuyNeural' }}
        run: python engine.py

      - name: 📤 Deliver 720p video
        uses: actions/upload-artifact@v4
        with:
          name: finished-720p-video
          path: |
            final_video.mp4
            subtitles.srt
            script.json
          retention-days: 30
