name: MMM Offline Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (leave blank to let the AI choose)'
        required: false
        default: ''
      minutes:
        description: 'Target length'
        required: false
        default: '12'
        type: choice
        options: ['4', '6', '8', '10', '12', '14', '16']
      voice:
        description: 'Edge-TTS voice'
        required: false
        default: 'en-US-GuyNeural'
        type: choice
        options:
          - en-US-GuyNeural
          - en-US-ChristopherNeural
          - en-US-EricNeural
          - en-US-RogerNeural
          - en-GB-RyanNeural
          - en-US-AndrewNeural
      passes:
        description: 'Quality/fact-check revision passes (more = slower, better)'
        required: false
        default: '4'
        type: choice
        options: ['1', '2', '3', '4', '6', '8']
      skip_brain_test_fixture:
        description: 'TEST MODE: skip Brain, use a hand-written script.json (for testing Engine alone, e.g. when the Gemini quota is exhausted)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  repository_dispatch:
    types: [start-render]

# a second run would fight the first for the runner; queue it instead
concurrency:
  group: mmm-factory
  cancel-in-progress: false

# this job only reads the repo - no reason to hand it write access
permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest
    # a hung run bills against the monthly Actions quota for as long as it
    # hangs, so keep the ceiling near the real worst case
    timeout-minutes: 45

    env:
      # without this Python block-buffers stdout and the log stays empty
      # until the step finishes, which looks exactly like a hang
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Fetch repo
        uses: actions/checkout@v4

      - name: Ensure FFmpeg + fonts
        run: |
          NEED=""
          command -v ffmpeg >/dev/null || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi dejavu || NEED="$NEED fonts-dejavu-core"
          if [ -n "$NEED" ]; then
            echo "installing:$NEED"
            sudo apt-get update -qq
            sudo apt-get install -y -qq $NEED
          else
            echo "ffmpeg and fonts already present on the runner"
          fi
          ffmpeg -version | head -n1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Brain (scriptwriter)
        if: ${{ github.event.inputs.skip_brain_test_fixture != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          TOPIC:          ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
          TARGET_MINUTES: ${{ github.event.inputs.minutes || github.event.client_payload.minutes || '12' }}
          STRICT_FACTS:   ${{ vars.STRICT_FACTS || '1' }}
          MAX_PASSES:     ${{ github.event.inputs.passes || vars.MAX_PASSES || '4' }}
          # Web research. All OPTIONAL - with none of these set, research falls
          # back to keyless DuckDuckGo, which needs no signup and has no quota.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Fallback writer models, used only if Gemini is rate-limited.
          # Both are free-tier with no card. Unset -> simply skipped.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Which free model each provider uses. Set these as repo VARIABLES
          # to chase whatever is currently free without touching code.
          CEREBRAS_MODEL:   ${{ vars.CEREBRAS_MODEL }}
          GROQ_MODEL:       ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python brain.py

      - name: Write test script.json (skip_brain_test_fixture)
        if: ${{ github.event.inputs.skip_brain_test_fixture == 'true' }}
        run: |
          cat > script.json <<'JSON'
          {
            "title": "Types of Business Expenses (engine test)",
            "description": "Engine test fixture in the money/business niche - not published content.",
            "thumb_headline": "Types of Business Expenses",
            "thumb_accent": "Business Expenses",
            "scenes": [
              {
                "scene": 1,
                "beat": "ANSWER",
                "key_term": "fixed costs",
                "key_fact": "They do not move when your sales move",
                "narration": "Business expenses fall into three groups, and the first is the one that quietly kills companies: fixed costs. Rent, salaries, insurance, software. They do not move when your sales move, which means a slow month costs exactly the same as a good one.",
                "image_keywords": ["empty office desk morning", "person reviewing paperwork", "small business storefront", "calculator and invoices"]
              },
              {
                "scene": 2,
                "beat": "CATEGORY",
                "key_term": "variable costs",
                "key_fact": "They rise and fall with every sale",
                "narration": "The second group is variable costs, and these behave in the opposite way. Materials, packaging, payment processing, delivery. They rise and fall with every sale you make, so a quiet month genuinely costs you less, and a busy one costs you more.",
                "image_keywords": ["packing boxes warehouse", "delivery van loading", "hands counting stock"]
              },
              {
                "scene": 3,
                "beat": "CATEGORY",
                "key_term": "one-off costs",
                "key_fact": "Rare, large, and easy to forget when planning",
                "narration": "Then there are one-off costs, the ones almost nobody plans for. A replaced laptop, a legal fee, a deposit, a repair. They are rare, large, and easy to forget when planning, and they are usually what turns a profitable month into a loss.",
                "image_keywords": ["broken laptop repair", "signing legal documents", "workshop tools bench"]
              },
              {
                "scene": 4,
                "beat": "CLOSE",
                "key_term": "runway",
                "key_fact": "Months of cash left at your current burn",
                "narration": "Add all three together against the cash in your account and you get runway: months of cash left at your current burn. Not revenue, not profit. Runway is the number that decides whether the business is still here next year.",
                "image_keywords": ["person checking bank balance phone", "calendar planning desk", "city street small shops"]
              }
            ]
          }
          JSON
          python -c "import json; json.load(open('script.json'))" && echo "script.json is valid JSON"

      - name: Upload script for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-json
          path: script.json
          if-no-files-found: warn
          retention-days: 30

      # Drawn from script.json alone - one tile per scene's key_term - so it
      # needs no extra AI call and no extra quota. Deliberately allowed to
      # fail: a missing thumbnail is a minor annoyance, and killing a
      # fifteen-minute video build over one PNG is not a trade worth making.
      - name: Make thumbnail
        continue-on-error: true
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -c "import thumbnail; thumbnail.from_script('script.json', 'thumbnail.png')"
          python -c "
          from PIL import Image
          im = Image.open('thumbnail.png')
          print(f'thumbnail.png {im.size[0]}x{im.size[1]}')
          assert im.size == (1280, 720), im.size
          "

      - name: Run Engine (video assembler)
        env:
          VOICE: ${{ github.event.inputs.voice || github.event.client_payload.voice || 'en-US-GuyNeural' }}
          # optional: real Pixabay stock footage/photos instead of AI images.
          # unset -> engine falls back to AI images only, same as before.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # explainer (bright, flat, readable) or cinematic (moody, narrative)
          STYLE: ${{ vars.STYLE || 'explainer' }}
        run: python engine.py

      - name: Disk report
        if: always()
        run: df -h / | tail -1

      - name: Deliver 720p video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finished-720p-video
          path: |
            final_video.mp4
            thumbnail.png
            subtitles.srt
            captions.ass
          if-no-files-found: warn
          # GitHub Free includes 500 MB of artifact storage in total. A 12-min
          # 720p file is ~100-150 MB, so 30-day retention fills the quota after
          # three or four videos and uploads then start failing. Download it,
          # then let it expire.
          retention-days: 3
